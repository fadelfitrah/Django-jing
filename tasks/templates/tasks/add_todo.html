<!-- @format -->

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Tugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex flex-col items-center min-h-screen p-6">
    <h2 class="text-2xl font-bold text-slate-700 mb-4">Tambah Tugas Baru</h2>
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-lg">
      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div class="space-y-2">{{ form.as_p }}</div>

        <button
          type="submit"
          class="bg-slate-700 text-white px-4 py-2 rounded-md hover:bg-slate-600 transition duration-300">
          Simpan
        </button>
      </form>
    </div>
  </body>
</html>
